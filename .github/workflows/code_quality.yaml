name: Code Quality
on:
  workflow_call:

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CI: "true"
  COLUMNS: "9999"
  NO_COLOR: "1"

jobs:
  lint:
    name: Linting / Formatting / Type checking / Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fetch the agnix binary
        run: bun node_modules/agnix/install.js

      - name: Keep committed migrations append-only
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bun scripts/check-migrations.ts --base "origin/$BASE_REF"

      - name: Sync SvelteKit
        run: bunx svelte-kit sync

      - name: Resolve prek version
        id: prek
        run: echo "version=$(jq -r .version node_modules/@j178/prek/package.json)" >> "$GITHUB_OUTPUT"

      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          extra-args: --all-files --no-fail-fast

      - name: Type check, circular imports and unit tests
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          extra-args: --all-files --no-fail-fast --hook-stage pre-push check circular test-unit

  app-tests:
    name: Integration and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Build
        env:
          AUTH_SECRET: placeholder-for-the-build-step-only-000000
        run: bun run build

      - name: Integration tests
        run: bun --config=tests/integration/bunfig.toml test tests/integration --timeout 60000

      - name: End-to-end tests
        run: bunx --bun playwright test
