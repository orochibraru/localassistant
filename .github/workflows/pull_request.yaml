name: Pull Request
on:
  pull_request:
  push:
    branches: [releaser/release]

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      checks: ${{ steps.diff.outputs.checks }}
      image: ${{ steps.diff.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the change
        id: diff
        env:
          REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          base="$(git merge-base HEAD origin/main)"
          if [ "$REF" = "releaser/release" ]; then
            other="$(git diff --name-only "$base" HEAD | grep -vxE 'CHANGELOG\.md|package\.json' || true)"
            if [ -n "$other" ] || [ "$(git show "$base:package.json" | jq -S 'del(.version)')" != "$(jq -S 'del(.version)' package.json)" ]; then
              echo "::error::The release PR changes more than CHANGELOG.md and package.json's version."
              echo "$other"
              exit 1
            fi
            echo "Release PR: only the version and CHANGELOG.md change, nothing to build."
            echo "checks=false" >> "$GITHUB_OUTPUT"
            echo "image=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "checks=true" >> "$GITHUB_OUTPUT"
          code="$(git diff --name-only "$base" HEAD | grep -vE '^(docs/|\.agents/|\.claude/)|\.md$' || true)"
          if [ -z "$code" ]; then
            echo "Docs-only change: checks run, no image."
            echo "image=false" >> "$GITHUB_OUTPUT"
          else
            echo "image=true" >> "$GITHUB_OUTPUT"
          fi

  code_quality:
    name: Code Quality
    needs: [changes]
    if: needs.changes.outputs.checks == 'true'
    uses: ./.github/workflows/code_quality.yaml

  build-app:
    name: Docker Build (App)
    needs: [changes, code_quality]
    if: needs.changes.outputs.image == 'true'
    uses: ./.github/workflows/docker.yaml
    with:
      image_tag: pr-${{ github.event.pull_request.number }}
      push:
        ${{ github.event.pull_request.head.repo.full_name == github.repository
        }}
      image_name: orochibraru/localassistant
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  publish:
    name: Publish pr-${{ github.event.pull_request.number }}
    needs: [build-app]
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/docker-manifest.yaml
    with:
      image_name: orochibraru/localassistant
      registry_name: docker.io
      registry_username: orochibraru
      bake_target: app
    secrets:
      registry_password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

  gate:
    name: CI Gate
    if: always()
    needs: [changes, code_quality, build-app, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "::error::One or more jobs failed or were cancelled"
              exit 1
            fi
          done
          echo "All checks passed (skipped jobs are OK)"
