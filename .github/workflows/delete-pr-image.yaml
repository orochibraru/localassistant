name: Delete PR Image

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
    secrets:
      registry_password:
        required: true

permissions:
  contents: read

env:
  TZ: Europe/Paris
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true

jobs:
  delete-image:
    name: Delete pr-${{ inputs.pr_number }} image
    runs-on: ubuntu-latest
    steps:
      - name: Delete the tag from Docker Hub
        env:
          DOCKER_HUB_USERNAME: orochibraru
          DOCKER_HUB_TOKEN: ${{ secrets.registry_password }}
          REPOSITORY: orochibraru/localassistant
          TAG: pr-${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          token="$(
            curl -fsS -X POST https://hub.docker.com/v2/users/login/ \
              -H 'Content-Type: application/json' \
              -d "$(jq -nc --arg u "$DOCKER_HUB_USERNAME" --arg p "$DOCKER_HUB_TOKEN" '{username: $u, password: $p}')" \
              | jq -r .token
          )"
          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Could not authenticate against Docker Hub"
            exit 1
          fi
          status="$(
            curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: JWT $token" \
              "https://hub.docker.com/v2/repositories/$REPOSITORY/tags/$TAG/"
          )"
          case "$status" in
            204|202) echo "Deleted $REPOSITORY:$TAG" ;;
            404) echo "No $REPOSITORY:$TAG to delete" ;;
            *) echo "::error::Deleting $REPOSITORY:$TAG failed with HTTP $status"; exit 1 ;;
          esac
