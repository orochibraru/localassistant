name: LocalAssistant
options:
  bundleIdPrefix: dev.localassistant
  deploymentTarget:
    iOS: "17.0"
targets:
  LocalAssistant:
    type: application
    platform: iOS
    sources: [LocalAssistant]
    info:
      path: LocalAssistant/Info.plist
      properties:
        CFBundleDisplayName: LocalAssistant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.orochibraru.localassistant
            CFBundleURLSchemes: [localassistant]
        UILaunchScreen: {}
        CADisableMinimumFrameDurationOnPhone: true
        NSCameraUsageDescription: Scan the code that signs you in.
        NSLocationWhenInUseUsageDescription: Tells the house whether you're home, when you choose to share it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orochibraru.localassistant
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS: $(inherited) -framework Shared
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build the Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          if command -v mise >/dev/null; then eval "$(mise env -s bash -C "$SRCROOT")"; fi
          cd "$SRCROOT/.." && ./gradlew :shared:embedAndSignAppleFrameworkForXcode
