<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#120a0d" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<title>Offline | LocalAssistant</title>
		<style>
			:root {
				color-scheme: light dark;
				--background: #f4f7f6;
				--foreground: #141a18;
				--muted: #55605c;
				--card: #ffffff;
				--primary: #911f43;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: #120a0d;
					--foreground: #f3eef0;
					--muted: #a99ea2;
					--card: #1d1216;
					--primary: #d9577f;
				}
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
					max(1.5rem, env(safe-area-inset-bottom));
				box-sizing: border-box;
				background: var(--background);
				color: var(--foreground);
				font-family: system-ui, -apple-system, sans-serif;
			}
			main {
				max-width: 22rem;
				padding: 2rem 1.5rem;
				border-radius: 1.5rem;
				background: var(--card);
				text-align: center;
			}
			img {
				width: 3rem;
				height: 3rem;
			}
			h1 {
				margin: 1.25rem 0 0.5rem;
				font-size: 1.25rem;
			}
			p {
				margin: 0;
				color: var(--muted);
				line-height: 1.5;
			}
			button {
				margin-top: 1.5rem;
				min-height: 2.75rem;
				padding: 0 1.5rem;
				border: 0;
				border-radius: 999px;
				background: var(--primary);
				color: #fff;
				font: inherit;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/favicon.svg" alt="" />
			<h1>You're offline</h1>
			<p>
				LocalAssistant needs the server to open this page. Expenses you added in an
				open group are kept on this device and sync once you're back.
			</p>
			<button type="button" onclick="location.reload()">Try again</button>
		</main>
	</body>
</html>
