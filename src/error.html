<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta
			name="theme-color"
			content="#fbf5f6"
			media="(prefers-color-scheme: light)"
		/>
		<meta
			name="theme-color"
			content="#120a0d"
			media="(prefers-color-scheme: dark)"
		/>
		<title>%sveltekit.status% · LocalAssistant</title>
		<style>
			:root {
				color-scheme: light dark;
				--background: oklch(0.975 0.007 8);
				--foreground: oklch(0.2 0.02 8);
				--muted: oklch(0.48 0.02 8);
				--primary: oklch(0.6 0.15 8);
				--on-primary: oklch(0.99 0.01 8);
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--background: oklch(0.145 0.018 8);
					--foreground: oklch(0.96 0.008 8);
					--muted: oklch(0.72 0.02 8);
					--primary: oklch(0.74 0.15 8);
					--on-primary: oklch(0.17 0.03 8);
				}
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.5rem;
				padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem
					max(1.5rem, env(safe-area-inset-bottom));
				text-align: center;
				background: var(--background);
				color: var(--foreground);
				font-family:
					system-ui,
					-apple-system,
					"Segoe UI",
					sans-serif;
			}
			.status {
				margin: 0;
				font-size: 4.5rem;
				font-weight: 700;
				letter-spacing: -0.025em;
				font-variant-numeric: tabular-nums;
				color: var(--primary);
			}
			h1 {
				margin: 0;
				font-size: 1.25rem;
				font-weight: 600;
			}
			.message {
				margin: 0.5rem 0 0;
				font-size: 0.875rem;
				color: var(--muted);
			}
			a {
				display: inline-flex;
				align-items: center;
				min-height: 2.75rem;
				padding: 0 1.5rem;
				border-radius: 9999px;
				background: var(--primary);
				color: var(--on-primary);
				font-size: 0.875rem;
				font-weight: 500;
				text-decoration: none;
			}
		</style>
	</head>
	<body>
		<p class="status">%sveltekit.status%</p>
		<div>
			<h1>Something went wrong</h1>
			<p class="message">%sveltekit.error.message%</p>
		</div>
		<a href="/">Back home</a>
	</body>
</html>
